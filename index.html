<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
</head>

<body>

    <h1>Student Management System</h1>

    <p>Manage student records easily.</p>

    <button onclick="showAddStudent()">Add Student</button>

    <h2>Students</h2>

    <input
        type="text"
        id="searchInput"
        placeholder="Search students..."
        onkeyup="searchStudents()"
    >

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Year</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="studentTableBody">
        </tbody>
    </table>

    <script>
        let students = JSON.parse(localStorage.getItem("students")) || [];

        function displayStudents(studentList = students) {
            const tableBody = document.getElementById("studentTableBody");

            tableBody.innerHTML = "";

            studentList.forEach((student, index) => {
                tableBody.innerHTML += `
                    <tr>
                        <td>${student.studentId}</td>
                        <td>${student.name}</td>
                        <td>${student.email}</td>
                        <td>${student.department}</td>
                        <td>${student.year}</td>
                        <td>
                            <button onclick="editStudent(${index})">Edit</button>
                            <button onclick="deleteStudent(${index})">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        function showAddStudent() {
            const studentId = prompt("Enter Student ID:");
            if (!studentId) return;

            const name = prompt("Enter Student Name:");
            if (!name) return;

            const email = prompt("Enter Email:");
            if (!email) return;

            const department = prompt("Enter Department:");
            if (!department) return;

            const year = prompt("Enter Year (1-4):");
            if (!year) return;

            students.push({
                studentId: studentId,
                name: name,
                email: email,
                department: department,
                year: year
            });

            localStorage.setItem("students", JSON.stringify(students));

            displayStudents();

            alert("Student added successfully!");
        }

        function deleteStudent(index) {
            if (confirm("Are you sure you want to delete this student?")) {
                students.splice(index, 1);

                localStorage.setItem("students", JSON.stringify(students));

                displayStudents();

                alert("Student deleted successfully!");
            }
        }

        function editStudent(index) {
            const student = students[index];

            const name = prompt("Enter Student Name:", student.name);
            if (!name) return;

            const email = prompt("Enter Email:", student.email);
            if (!email) return;

            const department = prompt(
                "Enter Department:",
                student.department
            );
            if (!department) return;

            const year = prompt("Enter Year (1-4):", student.year);
            if (!year) return;

            student.name = name;
            student.email = email;
            student.department = department;
            student.year = year;

            localStorage.setItem("students", JSON.stringify(students));

            displayStudents();

            alert("Student updated successfully!");
        }

        function searchStudents() {
            const searchValue =
                document.getElementById("searchInput").value.toLowerCase();

            const filteredStudents = students.filter(student =>
                student.studentId.toLowerCase().includes(searchValue) ||
                student.name.toLowerCase().includes(searchValue) ||
                student.email.toLowerCase().includes(searchValue) ||
                student.department.toLowerCase().includes(searchValue)
            );

            displayStudents(filteredStudents);
        }

        displayStudents();
    </script>

</body>
</html>
