<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <p class="subtitle">
            Manage student records easily
        </p>


        <!-- Add Student Form -->

        <div class="form-card">

            <h2 id="formTitle">Add Student</h2>

            <form id="studentForm">

                <input
                    type="text"
                    id="studentId"
                    placeholder="Student ID"
                    required
                >

                <input
                    type="text"
                    id="studentName"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="email"
                    id="studentEmail"
                    placeholder="Email"
                    required
                >

                <select id="studentDepartment" required>

                    <option value="">Select Department</option>

                    <option value="CSE">CSE</option>

                    <option value="IT">IT</option>

                    <option value="ECE">ECE</option>

                    <option value="EEE">EEE</option>

                    <option value="MECH">MECH</option>

                    <option value="CIVIL">CIVIL</option>

                </select>


                <select id="studentYear" required>

                    <option value="">Select Year</option>

                    <option value="1">1st Year</option>

                    <option value="2">2nd Year</option>

                    <option value="3">3rd Year</option>

                    <option value="4">4th Year</option>

                </select>


                <button type="submit">
                    Save Student
                </button>

                <button
                    type="button"
                    id="cancelButton"
                    onclick="cancelEdit()"
                    style="display: none;"
                >
                    Cancel
                </button>

            </form>

        </div>


        <!-- Student List -->

        <div class="student-section">

            <h2>Students</h2>


            <input
                type="text"
                id="searchInput"
                placeholder="Search by ID, name, email or department..."
                onkeyup="searchStudents()"
            >


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Student ID</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Department</th>

                            <th>Year</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="studentTableBody">
                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script>

        let students =
            JSON.parse(localStorage.getItem("students")) || [];

        let editingIndex = -1;


        // Display students

        function displayStudents(studentList = students) {

            const tableBody =
                document.getElementById("studentTableBody");

            tableBody.innerHTML = "";


            if (studentList.length === 0) {

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6">
                            No students found
                        </td>
                    </tr>
                `;

                return;
            }


            studentList.forEach(student => {

                const originalIndex =
                    students.findIndex(
                        s => s.studentId === student.studentId
                    );


                tableBody.innerHTML += `

                    <tr>

                        <td>${student.studentId}</td>

                        <td>${student.name}</td>

                        <td>${student.email}</td>

                        <td>${student.department}</td>

                        <td>${student.year}</td>

                        <td>

                            <button
                                onclick="editStudent(${originalIndex})"
                            >
                                Edit
                            </button>

                            <button
                                onclick="deleteStudent(${originalIndex})"
                            >
                                Delete
                            </button>

                        </td>

                    </tr>

                `;
            });
        }


        // Add / Update student

        document
            .getElementById("studentForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const studentId =
                    document
                        .getElementById("studentId")
                        .value
                        .trim();


                const name =
                    document
                        .getElementById("studentName")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("studentEmail")
                        .value
                        .trim();


                const department =
                    document
                        .getElementById("studentDepartment")
                        .value;


                const year =
                    document
                        .getElementById("studentYear")
                        .value;


                if (
                    !studentId ||
                    !name ||
                    !email ||
                    !department ||
                    !year
                ) {

                    alert("Please fill all fields.");

                    return;
                }


                // Check duplicate Student ID

                const duplicate =
                    students.some(
                        (student, index) =>
                            student.studentId === studentId &&
                            index !== editingIndex
                    );


                if (duplicate) {

                    alert("Student ID already exists.");

                    return;
                }


                const studentData = {

                    studentId: studentId,

                    name: name,

                    email: email,

                    department: department,

                    year: year

                };


                // Update

                if (editingIndex !== -1) {

                    students[editingIndex] =
                        studentData;

                    alert("Student updated successfully!");

                }

                // Add

                else {

                    students.push(studentData);

                    alert("Student added successfully!");

                }


                saveStudents();

                displayStudents();

                resetForm();

            });


        // Save to localStorage

        function saveStudents() {

            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );
        }


        // Edit student

        function editStudent(index) {

            const student = students[index];

            editingIndex = index;


            document.getElementById("studentId").value =
                student.studentId;

            document.getElementById("studentName").value =
                student.name;

            document.getElementById("studentEmail").value =
                student.email;

            document.getElementById("studentDepartment").value =
                student.department;

            document.getElementById("studentYear").value =
                student.year;


            document.getElementById("formTitle").textContent =
                "Edit Student";


            document.getElementById("studentId").disabled =
                true;


            document.getElementById("cancelButton").style.display =
                "inline-block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }


        // Delete student

        function deleteStudent(index) {

            const student =
                students[index];


            if (
                confirm(
                    "Are you sure you want to delete " +
                    student.name +
                    "?"
                )
            ) {

                students.splice(index, 1);

                saveStudents();

                displayStudents();

                alert("Student deleted successfully!");
            }
        }


        // Search students

        function searchStudents() {

            const searchValue =
                document
                    .getElementById("searchInput")
                    .value
                    .toLowerCase()
                    .trim();


            const filteredStudents =
                students.filter(student =>

                    student.studentId
                        .toLowerCase()
                        .includes(searchValue)

                    ||

                    student.name
                        .toLowerCase()
                        .includes(searchValue)

                    ||

                    student.email
                        .toLowerCase()
                        .includes(searchValue)

                    ||

                    student.department
                        .toLowerCase()
                        .includes(searchValue)

                );


            displayStudents(filteredStudents);
        }


        // Cancel edit

        function cancelEdit() {

            resetForm();
        }


        // Reset form

        function resetForm() {

            document
                .getElementById("studentForm")
                .reset();


            editingIndex = -1;


            document.getElementById("formTitle").textContent =
                "Add Student";


            document.getElementById("studentId").disabled =
                false;


            document.getElementById("cancelButton").style.display =
                "none";
        }


        // Load students when page opens

        displayStudents();

    </script>

</body>

</html>
